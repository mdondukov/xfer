[package]
name = "xfer"
version = "0.1.0"
edition = "2024"
description = "Move documents, photos and videos between Windows PCs and clean up duplicates"
license = "MIT"
repository = "https://github.com/mdondukov/xfer"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3.5.2"
filetime = "0.2.29"
fs4 = "1.1.0"
indicatif = "0.18.6"
rayon = "1.12.0"
redb = "4.4.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
