name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Runs the Windows-only tests too (long paths, drive letters).
      - run: cargo test --locked

      - run: cargo build --release --locked

      - run: Copy-Item target/release/xfer.exe xfer-windows-x64.exe

      # Downloadable from the run page for 30 days.
      - uses: actions/upload-artifact@v4
        with:
          name: xfer-windows-x64
          path: xfer-windows-x64.exe
          retention-days: 30

      # On a v* tag, attach the binary to a GitHub Release.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xfer-windows-x64.exe
          generate_release_notes: true
